name: Upload to Nexus Mods

# Thin caller: every bit of logic lives in reusable-nexusmods-upload.yml (the
# reusable workflow in orax-modding/publish), fetched at the pinned ref.
# Nothing else to copy from that repo. The changelog sent to Nexus is the body
# of the release being published (git-cliff notes).
# Template: orax-modding/publish README.md section 2.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  upload:
    uses: orax-modding/publish/.github/workflows/reusable-nexusmods-upload.yml@v0.1
    with:
      tag: ${{ github.event.release.tag_name }}
      mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
      file_id: ${{ vars.NEXUSMODS_FILE_ID }}
      # display_name: dist/AFK  # optional; defaults to dist/<repo-name>
    secrets: inherit
